<style>
  :root { --escura: #1c1410; --media: #4a2e1f; --destaque: #d9a441; --clara: #f6eadb; --texto: #2a1d16; --branco: #fffdf9;
    --titulo: "Playfair Display", Georgia, serif; --enfeite: "Dancing Script", cursive; --corpo: "Nunito", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  .marca img { height: 44px; width: auto; border-radius: 8px; }
  .marca .nome { font-family: var(--titulo); font-weight: 700; font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .marca .nome em { font-family: var(--enfeite); font-style: normal; color: var(--destaque); font-weight: 700; margin-right: 4px; }
  .menu { margin-left: auto; display: flex; gap: 22px; }

  .capa .fundo { position: absolute; inset: -8%; background-size: cover; background-position: var(--foco, 50% 45%); transform: scale(var(--zoom, 1.12)); transform-origin: var(--foco, 50% 45%); z-index: -2; filter: saturate(1.05); }
  .capa::after { content: ""; position: absolute; inset: 0; z-index: -1;

  .capa.sem-foto .fundo { display: none; }

  .chapeu { display: inline-block; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; font-size: .78rem; color: var(--destaque); margin-bottom: 14px; }

  .frase { background: var(--media); color: #fff; text-align: center; padding: 56px 16px; }

  .passos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; counter-reset: p; }
  .passo { background: var(--branco); border-radius: 18px; padding: 26px 22px; position: relative; box-shadow: 0 8px 24px #3a221212; }
  .passo::before { counter-increment: p; content: counter(p); position: absolute; top: -16px; left: 22px; width: 36px; height: 36px; border-radius: 50%; background: var(--destaque); color: var(--escura); font-weight: 800; display: grid; place-items: center; }
  .passo h3 { font-family: var(--titulo); font-size: 1.15rem; color: var(--media); margin: 8px 0 4px; }
  .passo p { color: #6b5a4f; }
  .centro { text-align: center; margin-top: 34px; }

  .estrelas { color: #f2b01e; letter-spacing: 2px; }
  .depo { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }

  .depo blockquote { color: #4d3d33; font-style: italic; margin: 8px 0 12px; }

  .info { background: var(--escura); color: #fff; border-radius: 24px; padding: 34px 30px; display: flex; flex-direction: column; gap: 22px; }
  .info h3 { font-family: var(--titulo); color: var(--destaque); font-size: 1.05rem; letter-spacing: .04em; margin-bottom: 4px; }
  .info .linha { opacity: .92; }
  .info table { border-collapse: collapse; width: 100%; }
  .info td { padding: 4px 0; border-bottom: 1px dashed #ffffff24; }
  .info td + td { text-align: right; font-weight: 700; }
  .tels a { display: block; text-decoration: none; font-weight: 700; font-size: 1.08rem; }
  .tels a small { font-weight: 600; color: #25d366; margin-left: 6px; }
  .redes { display: flex; gap: 10px; flex-wrap: wrap; }
  .redes a { border: 1px solid #ffffff3a; border-radius: 999px; padding: 7px 14px; text-decoration: none; font-weight: 600; font-size: .92rem; }
  .mapa { border-radius: 24px; overflow: hidden; min-height: 340px; box-shadow: 0 16px 40px #2a160b26; background: var(--clara); }
  .mapa iframe { width: 100%; height: 100%; min-height: 340px; border: 0; display: block; }
  @media (max-width: 760px) { .visita .caixa { grid-template-columns: 1fr; } }

  footer { background: var(--escura); color: #fff9; text-align: center; padding: 34px 16px 96px; font-size: .9rem; }
  footer b { color: #fff; font-family: var(--titulo); font-size: 1.1rem; display: block; margin-bottom: 4px; }
  footer .prop { margin-top: 10px; font-size: .78rem; opacity: .6; }

  .zap-fixo { position: fixed; right: 18px; bottom: 18px; z-index: 30; width: 60px; height: 60px; border-radius: 50%; background: #25d366; display: grid; place-items: center; box-shadow: 0 10px 28px #0005; animation: pulsa 2.6s infinite; }
  .zap-fixo svg { width: 32px; height: 32px; fill: #fff; }
  @keyframes pulsa { 0%, 100% { box-shadow: 0 10px 28px #0005, 0 0 0 0 #25d36680; } 50% { box-shadow: 0 10px 28px #0005, 0 0 0 14px #25d36600; } }
  .aparece { opacity: 0; transform: translateY(18px); transition: opacity .7s, transform .7s; }
  .aparece.vista { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .aparece { opacity: 1; transform: none; } .zap-fixo { animation: none; } }
</style>

  }
  const menu = [["produtos", D.produtos_titulo_menu || "O que temos", tem(D.produtos)], ["encomendas", "Encomendas", tem(D.encomenda?.passos)], ["avaliacoes", "Avaliações", tem(D.avaliacoes?.lista)], ["visite", "Onde estamos", true]];
  $(".menu").innerHTML = menu.filter((m) => m[2]).map(([id, t]) => `<a href="#${id}">${esc(t)}</a>`).join("");
  if (zapUrl) { const z = $(".zap-mini"); z.hidden = false; z.href = zapUrl; z.innerHTML = ZAP + "<span>Pedir</span>"; }

  // capa
  const capa = $(".capa");
  // foco = ponto da foto que importa; zoom = aproxima pra cortar bordas feias (ex.: botões do Street View)
  if (D.foto_capa) { $(".capa .fundo").style.backgroundImage = `url("${D.foto_capa}")`; if (D.foto_capa_foco) capa.style.setProperty("--foco", D.foto_capa_foco); if (D.foto_capa_zoom) capa.style.setProperty("--zoom", D.foto_capa_zoom); }
  else capa.classList.add("sem-foto");
  $(".capa .chapeu").textContent = [D.ramo, D.cidade].filter(tem).join(" · ");
  const slogan = D.slogan || nome;
  // a parte do slogan entre *asteriscos* sai na letra de enfeite, na cor de destaque
  $(".capa h1").innerHTML = esc(slogan).replace(/\*(.+?)\*/g, "<em>$1</em>");
  $(".capa .sub").textContent = D.subtitulo || "";
  $(".acoes").innerHTML = (zapUrl ? `<a class="bt bt-zap" href="${zapUrl}" target="_blank" rel="noopener">${ZAP}Pedir pelo WhatsApp</a>` : "") +
    (telUrl ? `<a class="bt bt-borda" href="${telUrl}">${FONE}Ligar agora</a>` : "") +
    (!zapUrl && !telUrl && mapsUrl ? `<a class="bt bt-borda" href="${mapsUrl}" target="_blank" rel="noopener">${MAPA}Como chegar</a>` : "");
  $(".selos").innerHTML = (D.destaques || []).slice(0, 4).map((s) => `<span>${esc(s)}</span>`).join("");

  // produtos
  if (tem(D.produtos)) {
    $("#produtos").hidden = false;
    $("#produtos .chapeu").textContent = D.produtos_chapeu || "Feito com carinho";
    $("#produtos h2").textContent = D.produtos_titulo || "O que você encontra aqui";
    $("#produtos .cabeca p").textContent = D.produtos_texto || "";
    $("#produtos .cards").innerHTML = D.produtos.slice(0, 6).map((p) => `<div class="card aparece"><div class="ic">${esc(p.icone || "✨")}</div><h3>${esc(p.titulo)}</h3><p>${esc(p.texto || "")}</p></div>`).join("");
  }
  // sobre
  if (tem(D.sobre)) {
    $("#sobre").hidden = false;
    $("#sobre h2").textContent = D.sobre_titulo || "Um cantinho pra você";
    $("#sobre p").textContent = D.sobre;
    const f = $("#sobre .foto"), foto = D.foto_sobre || D.foto_capa;
    if (foto) { f.innerHTML = "<i></i>"; f.firstChild.style.backgroundImage = `url("${foto}")`; f.style.setProperty("--foco", D.foto_sobre_foco || "50% 50%"); if (D.foto_sobre_zoom) f.style.setProperty("--zoom", D.foto_sobre_zoom); }
    else f.remove();
  }
  // galeria: fotos reais e de banco (ilustrativa: true = troca fácil pela foto do dono depois)
  const gal = (D.galeria || []).filter((g) => g && g.url).slice(0, 7);
  if (gal.length) {
    $("#fotos").hidden = false; $("#fotos h2").textContent = D.galeria_titulo || "Um pouco do nosso dia a dia";
    $("#fotos .galeria").innerHTML = gal.map((g) => `<figure class="aparece"><img loading="lazy" src="${esc(g.url)}" alt="${esc(g.legenda || nome)}" onerror="this.closest('figure').remove()">${g.legenda ? `<figcaption>${esc(g.legenda)}</figcaption>` : ""}</figure>`).join("");
  }
  if (gal.some((g) => g.ilustrativa) || D.fotos_ilustrativas) $("footer .prop").textContent = "Proposta de site · fotos ilustrativas";
  if (tem(D.frase)) { const fr = $(".frase"); fr.hidden = false; $(".frase p").textContent = D.frase; }
  // encomendas
  if (tem(D.encomenda?.passos)) {
    $("#encomendas").hidden = false;
    $("#encomendas h2").textContent = D.encomenda.titulo || "Faça sua encomenda";
    $("#encomendas .passos").innerHTML = D.encomenda.passos.slice(0, 4).map((p) => typeof p === "string" ? `<div class="passo aparece"><p>${esc(p)}</p></div>` : `<div class="passo aparece"><h3>${esc(p.titulo)}</h3><p>${esc(p.texto || "")}</p></div>`).join("");
    if (zapUrl) $("#encomendas .centro").innerHTML = `<a class="bt bt-zap" href="${zapUrl}" target="_blank" rel="noopener">${ZAP}Encomendar pelo WhatsApp</a>`;
  }
  // avaliações (só as reais, que a IA achou)
  const av = D.avaliacoes;
  if (tem(av?.lista)) {
    $("#avaliacoes").hidden = false;
    if (av.nota) $("#avaliacoes .nota").innerHTML = `<b>${esc(String(av.nota).replace(".", ","))}</b><div><div class="estrelas">${"★".repeat(Math.round(av.nota))}</div>${av.total ? esc(av.total) + " avaliações no Google" : "no Google"}</div>`;
    $("#avaliacoes .depo").innerHTML = av.lista.slice(0, 3).map((a) => `<figure class="aparece"><div class="estrelas">${"★".repeat(a.estrelas || 5)}</div><blockquote>“${esc(a.texto)}”</blockquote><figcaption>${esc(a.autor || "Cliente")}</figcaption></figure>`).join("");
  }
  // visite: endereço, horário, telefones, redes e mapa
  const tels = (D.telefones || []).map((t) => { const n = String(t.numero).replace(/\D/g, "").replace(/^55/, ""); return `<a href="${t.whatsapp ? "https://wa.me/55" + n : "tel:+55" + n}" ${t.whatsapp ? 'target="_blank" rel="noopener"' : ""}>${esc(t.numero)}${t.whatsapp ? "<small>WhatsApp</small>" : ""}</a>`; }).join("");
  const redes = [["Instagram", D.instagram], ["Facebook", D.facebook], ["Google Maps", mapsUrl]].filter((x) => tem(x[1]));
  $(".info").innerHTML =
    (endereco ? `<div><h3>ENDEREÇO</h3><div class="linha">${esc(endereco)}</div></div>` : "") +
    (tem(D.horario) ? `<div><h3>HORÁRIO</h3><table>${D.horario.map((h) => `<tr><td>${esc(h.dias)}</td><td>${esc(h.horas)}</td></tr>`).join("")}</table></div>` : "") +
    (tels ? `<div class="tels"><h3>FALE COM A GENTE</h3>${tels}</div>` : "") +
    (redes.length ? `<div><h3>SIGA E ENCONTRE</h3><div class="redes">${redes.map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${n}</a>`).join("")}</div></div>` : "");
  if (endereco) $(".mapa").innerHTML = `<iframe loading="lazy" title="Mapa" src="https://www.google.com/maps?q=${encodeURIComponent(nome + ", " + endereco)}&output=embed"></iframe>`;
  else $(".mapa").remove();

  $("footer b").textContent = nome;
  $("footer .end").textContent = endereco || D.cidade || "";
  if (zapUrl) { const z = $(".zap-fixo"); z.hidden = false; z.href = zapUrl; z.innerHTML = ZAP; }

  // topo escurece ao rolar; blocos aparecem suave
  const topo = $(".topo"), rolar = () => topo.classList.toggle("rolou", scrollY > 40);
  addEventListener("scroll", rolar, { passive: true }); rolar();
  const io = "IntersectionObserver" in window ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("vista"); io.unobserve(e.target); } }), { threshold: .12 }) : null;
  document.querySelectorAll(".aparece").forEach((el) => (io ? io.observe(el) : el.classList.add("vista")));
})();
</script>
</body>
</html>
