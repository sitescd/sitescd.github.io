  if(f){v.preventDefault();v.stopPropagation();editarFoto(f)}
},true);
// ---- D versão 2 ----
var topo=null,mx=null,fim=null,viuFim=false,ligou=false;
function escuro(){marcar();var on=document.documentElement.classList.toggle("scd-dark");
  topo.querySelector("span").textContent=on?"☀️ Voltar pro claro":(lerTema().claro?"🌙 Ver no modo escuro":"☀️ Ver no modo claro");
  if(on)conta("escuro")}
function montar(){
  if(ligou)return;ligou=true;var t=lerTema();
  topo=vidro("button","scd-topo","<span>"+(t.claro?"🌙 Ver no modo escuro":"☀️ Ver no modo claro")+"</span><i class='scd-sw'></i>");topo.type="button";topo.onclick=escuro;
  mx=vidro("button","scd-mx","<span class='scd-ic'>✏️</span><span><b class='scd-tt'>Mexer no site</b><small>Troque foto, texto ou letra pelo celular</small></span><span class='scd-sa'>›</span>");mx.type="button";
  mx.onclick=function(){conta("mexer");explica()};
  mostra();
}
// recado do fim: entra no fluxo da página, antes do rodapé do site (ou no fim)
function poeFim(){
  var w=pinta(el("section","scd-v scd-fim","<div class='scd-cd'><small class='scd-ey'>Esse site é seu</small><h2 class='scd-tt'>"+C.nome+"</h2>"+
    "<p>Quer outra foto, outro horário ou outra cor? Você muda pelo celular, ou a gente muda pra você.</p>"+
    "<a class='scd-g' data-c='gostei' href='"+C.gostei+"' target='_blank' rel='noopener'>👍 Gostei desse</a>"+
    (C.outro?"<a class='scd-o' data-c='outro' href='"+C.outro+"'>Ver outro modelo</a>":"")+
    "<div class='scd-lk'>Quer um site personalizado? <a data-c='perso' href='"+C.perso+"' target='_blank' rel='noopener'>Fale com a gente</a></div></div>"));
  var ft=[].slice.call(document.querySelectorAll("footer")).pop();
  if(ft&&ft.parentNode)ft.parentNode.insertBefore(w,ft);else document.body.appendChild(w);
  w.addEventListener("click",function(v){var a=v.target.closest("[data-c]");if(a)conta(a.dataset.c)});
  if("IntersectionObserver" in window)new IntersectionObserver(function(es){es.forEach(function(e){viuFim=e.isIntersecting;mostra()})},{threshold:.15}).observe(w);
  fim=w;
}
// não brigar com o que o site já tem fixo: a barra do escuro fica logo ABAIXO do cabeçalho fixo do site, e o botão
// largo não cobre o botão redondo do WhatsApp do site (fica do lado dele)
function fixos(){var r=[];document.querySelectorAll("body *").forEach(function(e,i){if(i>3000||ui(e))return;var p=getComputedStyle(e).position;
  if((p==="fixed"||p==="sticky")&&e.offsetWidth&&e.offsetHeight)r.push(e.getBoundingClientRect())});return r}
function encaixa(){if(!mx)return;var fs=fixos(),W=innerWidth,H=innerHeight,cab=0,dir=12;
  fs.forEach(function(q){if(q.top<=4&&q.height<170&&q.width>W*.6)cab=Math.max(cab,q.bottom)});
  topo.classList.toggle("scd-sob",cab>0);topo.style.top=cab>0?Math.round(cab)+"px":"";
  var m=mx.getBoundingClientRect(),esq=Math.max(12,(W-Math.min(440,W-24))/2);
  fs.forEach(function(q){if(q.bottom>H-170&&q.width<160&&q.left>W*.5&&q.left<esq+Math.min(440,W-24)+8)dir=Math.max(dir,W-q.left+10)});
  mx.style.right=dir+"px";mx.style.width="auto";mx.style.marginRight=dir>12?"0":"auto"}
function mostra(){if(!mx)return;encaixa();mx.classList.toggle("on",!ed&&!viuFim);topo.classList.toggle("on",!ed)}
var tic=0;addEventListener("scroll",function(){if(!ligou||tic)return;tic=setTimeout(function(){tic=0;encaixa()},250)},{passive:true});
addEventListener("resize",function(){encaixa()});
// ritmo: nada na 1ª tela; depois de ~1,2 tela descida aparecem o topo e o botão
function rolou(){if(!ligou&&scrollY>innerHeight*1.2)montar()}
addEventListener("scroll",rolou,{passive:true});
function nossoZap(){var z=document.querySelector(".zap-fixo,#zapfixo");if(!z||!C.chip)return;
  z.href=C.chip;z.target="_blank";z.hidden=false;z.setAttribute("aria-label","Falar com a Sites CD no WhatsApp");
  if(!z.innerHTML.trim())z.innerHTML="<span style='font-size:28px;line-height:1'>💬</span>"}
function inicio(){poeFim();nossoZap();setTimeout(marcar,800)}
addEventListener("load",nossoZap);
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",inicio);else inicio();
})();
</script>
