<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Porto Saúde – Material de apoio</title>
<style>
:root{--azul:#1c3a8a;--marinho:#13265c;--fundo:#eef2f8;--card:#fff;--txt:#14213d;--suave:#5b6b88;--linha:#d9e1ee;--claro:#e3ebfa}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--marinho);color:#fff;padding:10px 16px 12px;box-shadow:0 2px 8px #0003}
.topo{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.marca{font-weight:700;font-size:18px;letter-spacing:-.2px;text-decoration:none;white-space:nowrap}
.marca small{display:block;font-weight:400;font-size:11px;opacity:.75;letter-spacing:.2px}
.busca{flex:1;position:relative}
.busca input{width:100%;border:0;border-radius:22px;padding:10px 14px 10px 36px;font-size:15px;background:#fff;color:var(--txt);outline:none}
.busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
main{max-width:760px;margin:0 auto;padding:14px 16px 96px}
.trilha{font-size:13px;color:var(--suave);margin:2px 0 8px}
.trilha a{text-decoration:none;color:var(--azul);font-weight:600}
h1{font-size:21px;margin:0 0 12px;line-height:1.25}
h2{font-size:15px;margin:22px 0 10px;color:var(--suave);text-transform:uppercase;letter-spacing:.6px}
.linhas{display:grid;gap:10px}
.linha{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--azul),var(--marinho));color:#fff;border-radius:14px;padding:16px;text-decoration:none;box-shadow:0 2px 6px #13265c33;transition:transform .12s}
.linha:active{transform:scale(.98)}
.linha b{font-size:17px;display:block}
.linha span{font-size:13px;opacity:.85}
.linha .seta{margin-left:auto;font-size:22px;opacity:.8;transition:transform .2s}
button.linha{width:100%;border:0;text-align:left;font:inherit;cursor:pointer}
.linha[aria-expanded=true]{border-radius:14px 14px 0 0}
.linha[aria-expanded=true] .seta{transform:rotate(90deg)}
.gaveta{background:#dfe7f5;border-radius:0 0 14px 14px;padding:10px}
.sobre{display:block;text-align:center;font-size:14px;font-weight:600;color:var(--azul);text-decoration:none;padding:12px 4px 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:10px 14px;font-size:14px;text-decoration:none;font-weight:600;color:var(--azul)}
.chip.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grade a{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:14px 12px;text-decoration:none;font-weight:600;font-size:15px;color:var(--marinho);min-height:52px;display:flex;align-items:center}
.folha{margin-top:14px;position:relative;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #0002}
.folha img{display:block;width:100%;height:auto}
.alvo{position:absolute;display:block;border-radius:8px;background:#2f6bff00;outline:2px solid #2f6bff00;transition:background .3s,outline-color .3s}
.fatia{position:relative;overflow:hidden;width:100%}
.fatia img{position:absolute;left:0;width:100%;display:block}
button.alvo{border:0;padding:0;cursor:pointer;font:inherit}
.alvo[aria-expanded=true]{background:#2f6bff1a;outline-color:#2f6bff88}
.capa .gaveta{border-radius:0 0 8px 8px;margin-top:0;margin-bottom:6px}
.capa button.alvo{border-radius:6px}
.capa button.alvo[aria-expanded=true]{border-radius:6px 6px 0 0}
.alvo:hover,.mostra .alvo{background:#2f6bff22;outline-color:#2f6bffaa}
.dica{font-size:12.5px;color:var(--suave);margin:8px 2px 0;display:flex;justify-content:space-between;gap:8px}
.dica button{border:0;background:none;color:var(--azul);font-weight:600;font-size:12.5px;padding:0;cursor:pointer}
.rede{display:block;text-align:center;background:var(--azul);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:15px;margin:12px 0 0;font-size:16px}
nav.pe{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--linha);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
nav.pe div{max-width:760px;margin:0 auto;display:flex;gap:8px}
nav.pe a{flex:1;text-align:center;text-decoration:none;padding:11px 6px;border-radius:10px;background:var(--claro);color:var(--marinho);font-weight:700;font-size:14px}
nav.pe a.off{opacity:.35;pointer-events:none}
nav.pe a.meio{flex:1.3;background:var(--marinho);color:#fff}
.res a{display:block;background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;margin-bottom:8px;text-decoration:none}
.res b{display:block;color:var(--marinho)}
.res small{color:var(--suave)}
.res mark{background:#ffe58a;color:inherit}
.vazio{color:var(--suave);padding:20px 0}
footer{font-size:11.5px;color:var(--suave);text-align:center;margin-top:26px}
</style>
</head>
<body>
<header><div class="topo">
  <a class="marca" href="#/">Porto Saúde<small>Material de apoio</small></a>
  <label class="busca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14213d" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" placeholder="Bairro, cidade, hospital..." autocomplete="off"></label>
</div></header>
<main id="app"></main>
<nav class="pe" id="pe" hidden><div><a id="ant">‹ Anterior</a><a id="lista" class="meio">Lista</a><a id="prox">Próxima ›</a></div></nav>
<script src="dados.js"></script>
<script>
const D = window.DADOS, $ = s => document.querySelector(s), app = $("#app");
const P = n => D.pags[n - 1];
const sa = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const esc = t => t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const curto = t => t.replace(/^(Portomed |Linha Pro |Linha Porto Saúde - |Linha Tradicional - )/, "");
const lugar = s => s.nome.match(/Bairros/) ? "Escolha 1 ou 3 hospitais • 3 a 99 vidas" : s.nome.match(/Pro/) ? "Regional • 3 a 499 vidas" : "Nacional";

function folha(n) {
  const p = P(n);
  const alvos = p.l.map(l => `<a class="alvo" href="${l.url ? esc(l.url) : "#/p/" + l.pag}" ${l.url ? 'target="_blank" rel="noopener"' : ""} aria-label="${esc(l.nome)}" style="left:${l.a[0]}%;top:${l.a[1]}%;width:${l.a[2]}%;height:${l.a[3]}%"></a>`).join("");
  return `<div class="folha" id="folha"><img src="pag/${String(n).padStart(2, "0")}.webp" width="${p.w * 2}" height="${p.h * 2}" alt="${esc(p.t)}">${alvos}</div>
  ${p.l.length ? `<p class="dica"><span>Toque nas partes destacadas para abrir.</span><button onclick="pisca()">Mostrar botões</button></p>` : ""}`;
}
function pisca() { const f = $("#folha"); if (!f) return; f.classList.add("mostra"); setTimeout(() => f.classList.remove("mostra"), 1600); }

function inicio() {
  // pagina 1 do PDF exatamente como e, cortada embaixo de cada cartao de Linha pra a lista abrir ali
  $("#pe").hidden = true;
  const p = P(1), img = `pag/01.webp`;
  const cart = p.l.filter(l => l.cartao).sort((a, b) => a.a[1] - b.a[1]);
  const cortes = [0];
  cart.forEach((c, k) => cortes.push(k < cart.length - 1 ? (c.a[1] + c.a[3] + cart[k + 1].a[1]) / 2 : c.a[1] + c.a[3] + 0.3));
  cortes.push(100);
  let html = "";
  for (let k = 0; k < cortes.length - 1; k++) {
    const y0 = cortes[k], y1 = cortes[k + 1], alt = y1 - y0;
    const dentro = p.l.filter(l => l.a[1] >= y0 && l.a[1] < y1);
    const alvos = dentro.map(l => {
      const st = `left:${l.a[0]}%;top:${(l.a[1] - y0) / alt * 100}%;width:${l.a[2]}%;height:${l.a[3] / alt * 100}%`;
      const si = l.pag ? D.secoes.findIndex(s => s.abre === l.pag) : -1;
      if (si >= 0 && cart.includes(l)) return `<button class="alvo" id="b${si}" onclick="abre(${si})" aria-expanded="false" aria-label="${esc(l.nome)}" style="${st}"></button>`;
      return `<a class="alvo" href="${l.url ? esc(l.url) : "#/p/" + l.pag}" ${l.url ? 'target="_blank" rel="noopener"' : ""} aria-label="${esc(l.nome)}" style="${st}"></a>`;
    }).join("");
    html += `<div class="fatia" style="aspect-ratio:${p.w} / ${p.h * alt / 100}"><img src="${img}" alt="" style="top:${-y0 / alt * 100}%;height:${100 / alt * 100}%">${alvos}</div>`;
    const c = cart[k];
    if (c) {
      const i = D.secoes.findIndex(s => s.abre === c.pag), s = D.secoes[i];
      html += `<div class="gaveta" id="g${i}" hidden style="margin-left:${c.a[0]}%;margin-right:${100 - c.a[0] - c.a[2]}%"><div class="grade">${s.itens.map(n => `<a href="#/p/${n}">${esc(curto(P(n).t))}</a>`).join("")}</div>
        <a class="sobre" href="#/p/${s.abre}">Ver a apresentação ›</a></div>`;
    }
  }
  app.innerHTML = `<div class="folha capa" id="folha">${html}</div>
  <p class="dica"><span>Toque numa Linha para ver as opções.</span><button onclick="pisca()">Mostrar botões</button></p>`;
  let aberta = null; try { aberta = sessionStorage.getItem("aberta"); } catch (e) {} if (aberta) abre(+aberta);
}
function abre(i) {
  const g = $("#g" + i), b = $("#b" + i); if (!g) return; const fechar = !g.hidden;
  document.querySelectorAll(".gaveta").forEach(x => x.hidden = true);
  document.querySelectorAll("button.alvo").forEach(x => x.setAttribute("aria-expanded", "false"));
  try { sessionStorage.removeItem("aberta"); } catch (e) {}
  if (!fechar) { g.hidden = false; b.setAttribute("aria-expanded", "true"); try { sessionStorage.setItem("aberta", i); } catch (e) {} }
}

function pagina(n) {
  const p = P(n); if (!p) return inicio();
  const s = p.s != null ? D.secoes[p.s] : null;
  let trilha = `<a href="#/">Início</a>`, extra = "", lista = [];
  if (s) {
    if (n !== s.abre) trilha += ` › <a href="#/p/${s.abre}">${esc(s.nome)}</a>`;
    lista = [s.abre, ...s.itens];
    const chips = s.itens.map(i => `<a href="#/p/${i}" ${i === n ? 'style="background:var(--azul);color:#fff"' : ""}>${esc(curto(P(i).t))}</a>`).join("");
    extra = n === s.abre ? `<h2>Escolha a opção</h2><div class="grade">${chips}</div>`
                         : `<h2>Outras opções da ${esc(s.nome)}</h2><div class="grade">${chips}</div>`;
  } else {
    lista = D.pags.filter(x => x.s == null && x.n > 1).map(x => x.n);
  }
  const rede = p.l.some(l => l.url === D.rede) ? `<a class="rede" href="${D.rede}" target="_blank" rel="noopener">Consultar a rede completa ›</a>` : "";
  app.innerHTML = `<div class="trilha">${trilha}</div><h1>${esc(p.t)}</h1>${n === s?.abre ? extra.replace("<h2>", '<h2 style="margin-top:0">') : ""}${folha(n)}${rede}${n !== s?.abre ? extra : ""}`;
  const i = lista.indexOf(n), ant = lista[i - 1], prox = lista[i + 1];
  $("#pe").hidden = false;
  $("#ant").className = ant ? "" : "off"; $("#ant").href = ant ? "#/p/" + ant : "#";
  $("#prox").className = prox ? "" : "off"; $("#prox").href = prox ? "#/p/" + prox : "#";
  $("#lista").href = s ? "#/p/" + s.abre : "#/"; $("#lista").textContent = s ? (n === s.abre ? "Início" : "Lista") : "Início";
  if (s && n === s.abre) $("#lista").href = "#/";
  if (p.l.length) setTimeout(pisca, 350);
}

function busca(q) {
  $("#pe").hidden = true;
  const termos = sa(q).split(/\s+/).filter(Boolean);
  const achou = D.pags.filter(p => termos.every(t => (p.x + " " + sa(p.t)).includes(t)))
    .sort((a, b) => (termos.every(t => sa(b.t).includes(t)) - termos.every(t => sa(a.t).includes(t))) || a.n - b.n);
  const trecho = p => { const i = p.x.indexOf(termos[0]); if (i < 0) return ""; const s = p.x.slice(Math.max(0, i - 40), i + 70);
    return "…" + esc(s).replace(new RegExp(termos.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g"), m => `<mark>${m}</mark>`) + "…"; };
  app.innerHTML = `<div class="trilha"><a href="#/">Início</a> › Busca</div><h1>“${esc(q)}”</h1>
  <div class="res">${achou.length ? achou.map(p => `<a href="#/p/${p.n}"><b>${esc(p.t)}</b><small>${p.s != null ? esc(D.secoes[p.s].nome) + " · " : ""}${trecho(p)}</small></a>`).join("")
    : `<p class="vazio">Nada encontrado. Tente só o nome do bairro ou da cidade.</p>`}</div>`;
}

function rota() {
  const h = decodeURIComponent(location.hash.slice(1));
  let m;
  if ((m = h.match(/^\/p\/(\d+)/))) pagina(+m[1]);
  else if ((m = h.match(/^\/busca\/(.+)/))) { busca(m[1]); $("#q").value = m[1]; }
  else inicio();
  window.scrollTo(0, 0);
}
let tempo;
$("#q").addEventListener("input", e => { clearTimeout(tempo); const v = e.target.value.trim();
  tempo = setTimeout(() => { if (v.length >= 2) location.replace("#/busca/" + encodeURIComponent(v)); else if (!v) location.replace("#/"); }, 250); });
// arrastar pro lado = proxima/anterior
let x0 = null, y0 = null;
addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
addEventListener("touchend", e => { if (x0 == null || $("#pe").hidden) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) { const a = dx < 0 ? $("#prox") : $("#ant"); if (!a.classList.contains("off")) location.hash = a.getAttribute("href"); } x0 = null; });
addEventListener("hashchange", rota); rota();
</script>
</body>
</html>
