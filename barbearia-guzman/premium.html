<style>
  :root { --fundo: #fafaf9; --branco: #fff; --tinta: #1c1917; --texto: #44403c; --cinza: #78716c; --linha: #e7e5e4;
    --ac: #0f766e; --ac-forte: #0f766e; --ac-suave: #ccfbf1; --ac-tinta: #0f766e; --escura: #1c1917;
    --serif: "Source Serif 4", Georgia, serif; --corpo: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
    --sombra: rgba(0,0,0,.02) 0 140px 56px, rgba(0,0,0,.07) 0 78px 47px, rgba(0,0,0,.1) 0 7px 14px, rgba(0,0,0,.12) 0 9px 19px;
    --sombra-leve: 0 1px 2px #0000000d, 0 8px 24px #0000000f; --sobre-ac: #fff;
    --legenda: #fffffff0; --chat: #efeae2; --msg-eu: #d9fdd3; --msg-loja: #fff; --msg-txt: #111; --msg-hora: #667781; }
  /* 08/10 (Caio: "hamburgueria é escuro, churrascaria"): PREMIUM ESCURO = o mesmo modelo com outras cores de base.
     Liga sozinho pelo ramo (ver ESCURO no script) ou pelo campo tema: "escuro" / "claro" no dados.json */
  :root.escuro { --fundo: #0e0e10; --branco: #17171a; --tinta: #fafaf9; --texto: #d4d4d8; --cinza: #a1a1aa; --linha: #ffffff1f;
    --sombra: 0 40px 80px #000a, 0 10px 24px #0008; --sombra-leve: 0 10px 28px #0009;
    --legenda: #17171aee; --chat: #0b141a; --msg-eu: #005c4b; --msg-loja: #202c33; --msg-txt: #e9edef; --msg-hora: #8696a0; color-scheme: dark; }
  :root.escuro .capa { background: radial-gradient(ellipse 70% 60% at 85% 10%, color-mix(in srgb, var(--ac) 16%, transparent), transparent 70%); }
  :root.escuro .frase { background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--ac) 22%, var(--fundo)), var(--fundo) 75%); }
  :root.escuro footer { background: #000; border-top: 1px solid var(--linha); }
  :root.escuro .tels small { color: #4ade80; background: #052e16; }
  :root.escuro .bt-ac { box-shadow: 0 8px 26px color-mix(in srgb, var(--ac) 28%, transparent); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--corpo); color: var(--texto); background: var(--fundo); line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  .caixa { width: min(1160px, 100% - 32px); margin-inline: auto; }
  .eti { display: inline-block; font: 600 .72rem/1.4 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ac-tinta); }
  h1, h2, h3.serif { font-family: var(--serif); color: var(--tinta); font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
  h1 em, h2 em { font-style: normal; color: var(--ac-tinta); }
  h2 { font-size: clamp(1.9rem, 3.6vw, 2.75rem); line-height: 1.12; }
  .cabeca { text-align: center; max-width: 640px; margin: 0 auto 48px; }
  .cabeca h2 { margin-top: 10px; }
  .cabeca p { margin-top: 12px; color: var(--cinza); font-size: 1.05rem; }
  section { padding: clamp(72px, 10vw, 120px) 0; }
  section + section { border-top: 1px solid var(--linha); }
  .branco { background: var(--branco); }

  /* surgir (o "bloco vai surgindo" do CheckMulta) */
  .rv { opacity: 0; transform: translateY(16px); transition: opacity .55s ease, transform .55s ease; transition-delay: var(--d, 0s); }
  .rv.vista { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }

  /* botões */
  .bt { display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 14px 22px; border-radius: 12px; font: 600 .98rem var(--corpo); text-decoration: none; border: 1px solid transparent; transition: transform .15s, box-shadow .2s, background .2s; cursor: pointer; }
  .bt:hover { transform: translateY(-2px); }
  .bt svg { width: 19px; height: 19px; flex: none; }
  .bt-ac { background: var(--ac-forte); color: var(--sobre-ac); box-shadow: 0 8px 22px color-mix(in srgb, var(--ac-forte) 32%, transparent); }
  .bt-ac:hover { box-shadow: 0 12px 28px color-mix(in srgb, var(--ac-forte) 42%, transparent); }
  .bt-borda { background: var(--branco); border-color: var(--linha); color: var(--tinta); }
  .bt-borda:hover { border-color: var(--ac); }

  /* topo */
  .topo { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--fundo) 86%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid transparent; transition: border-color .3s, box-shadow .3s; }
  .topo.rolou { border-color: var(--linha); box-shadow: 0 6px 20px #0000000a; }
  .topo .caixa { display: flex; align-items: center; gap: 18px; height: 70px; }
  .marca { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
  .marca img { height: 42px; width: auto; border-radius: 8px; }
  .marca img.clara { background: var(--escura); padding: 5px 9px; }
  .chat .av img.clara { background: var(--escura); padding: 4px; object-fit: contain; }
  .marca img.escura { background: #f5f5f4; padding: 5px 9px; }
  .chat .av img.escura { background: #f5f5f4; padding: 4px; object-fit: contain; }
  .marca .recorte { height: 42px; aspect-ratio: var(--prop, 2.4); border-radius: 8px; background-repeat: no-repeat; box-shadow: 0 0 0 1px var(--linha); flex: none; }
  .marca .nome { font: 700 1.22rem var(--serif); color: var(--tinta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .marca .nome em { font-style: normal; color: var(--ac-tinta); }
  .menu { margin-left: auto; display: flex; gap: 26px; }
  .menu a { text-decoration: none; font-size: .93rem; color: var(--texto); }
  .menu a:hover { color: var(--ac-tinta); }
  .topo .bt { padding: 9px 16px; font-size: .9rem; border-radius: 10px; }
  .topo .bt svg { width: 17px; height: 17px; }
  @media (max-width: 820px) { .menu { display: none; } .topo .bt { margin-left: auto; } }

  /* capa */
  .capa { padding: clamp(40px, 7vw, 88px) 0 clamp(56px, 8vw, 96px); border-top: 0; overflow: hidden; }
  .capa .caixa { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(32px, 5vw, 72px); align-items: center; }
  .capa h1 { font-size: clamp(2.4rem, 5.4vw, 4.1rem); line-height: 1.06; margin: 14px 0 18px; }
  .capa h1 .p { display: inline-block; opacity: 0; transform: translateY(.4em); animation: sobe .6s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i) * 55ms + .1s); }
  @keyframes sobe { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .capa h1 .p { opacity: 1; transform: none; animation: none; } }
  .capa .sub { font-size: 1.1rem; color: var(--texto); max-width: 52ch; }
  .acoes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .selos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
  .selos span { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 9px; border: 1px solid color-mix(in srgb, var(--ac) 35%, var(--linha)); border-radius: 999px; background: var(--branco); font: 600 .68rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--tinta); }
  .selos b { font-weight: inherit; }
  .selos svg { width: 13px; height: 13px; color: var(--ac-tinta); flex: none; }
  .vitrine { position: relative; }
  .vitrine .foto { aspect-ratio: 4 / 4.4; border-radius: 28px; overflow: hidden; box-shadow: var(--sombra); border: 1px solid var(--linha); background: var(--branco); }
  .vitrine .foto i { display: block; width: 100%; height: 100%; background-size: cover; background-position: var(--foco, 50% 50%); transform: scale(var(--zoom, 1)); transform-origin: var(--foco, 50% 50%); animation: respira 18s ease-in-out infinite alternate; }
  @keyframes respira { to { transform: scale(calc(var(--zoom, 1) * 1.06)); } }
  .vitrine.sem-foto .foto { display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, var(--ac-suave), var(--branco) 70%); }
  .vitrine.sem-foto .foto b { font: 700 clamp(2rem, 5vw, 3.4rem)/1.1 var(--serif); color: var(--tinta); text-align: center; padding: 24px; }
  .flutua { position: absolute; background: var(--branco); border: 1px solid var(--linha); border-radius: 16px; box-shadow: var(--sombra-leve); padding: 14px 16px; animation: boia 5s ease-in-out infinite alternate; }
  @keyframes boia { to { transform: translateY(-8px); } }
  .flutua.a { left: -28px; bottom: 34px; display: flex; align-items: center; gap: 12px; max-width: 260px; }
  .flutua.a b { font: 700 1.9rem/1 var(--serif); color: var(--tinta); }
  .flutua.a small { display: block; font-size: .78rem; color: var(--cinza); line-height: 1.35; }
  .estrelas { color: #f5a524; letter-spacing: 2px; font-size: .9rem; }
  .flutua.b { right: -18px; top: 30px; animation-delay: -2.5s; display: flex; align-items: center; gap: 8px; font: 600 .68rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta); }
  .flutua.b i { width: 8px; height: 8px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 0 4px var(--ac-suave); }
  @media (max-width: 900px) {
    .capa .caixa { grid-template-columns: 1fr; }
    .selos { justify-content: center; }   /* 08/10 (Caio): no celular os selos ficam no meio, senão pendem pra um lado */
    .vitrine { max-width: 520px; width: 100%; margin: 8px auto 0; }
    .vitrine .foto { aspect-ratio: 4 / 3.4; }
    .flutua.a { left: 12px; bottom: -22px; } .flutua.b { right: 12px; top: -14px; }
  }

  /* faixa que corre (o que tem) */
  .faixa { border-block: 1px solid var(--linha); background: var(--branco); overflow: hidden; padding: 16px 0; }
  .faixa .trilho { display: flex; width: max-content; animation: corre 38s linear infinite; }
  .faixa span { display: inline-flex; align-items: center; gap: 14px; padding-right: 40px; font: 600 .78rem var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--tinta); white-space: nowrap; }
  .faixa span::after { content: ""; width: 7px; height: 7px; transform: rotate(45deg); background: var(--ac); margin-left: 26px; }
  @keyframes corre { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .faixa .trilho { animation: none; } }

  /* produtos */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .card { position: relative; background: var(--branco); border: 1px solid var(--linha); border-radius: 18px; padding: 24px 22px 20px; display: flex; flex-direction: column; transition: transform .2s, box-shadow .25s, border-color .25s; }
  .card:hover { transform: translateY(-4px); box-shadow: var(--sombra-leve); border-color: color-mix(in srgb, var(--ac) 45%, var(--linha)); }
  .card .ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--ac-suave); font-size: 1.4rem; }
  .card .seta { position: absolute; right: 20px; top: 24px; color: var(--cinza); transition: transform .2s, color .2s; }
  .card:hover .seta { transform: translateX(3px); color: var(--ac-tinta); }
  .card h3 { margin: 18px 0 6px; font-size: 1.05rem; color: var(--tinta); }
  .card p { color: var(--cinza); font-size: .95rem; flex: 1; }
  .card .num { margin-top: 18px; font: 600 .68rem var(--mono); letter-spacing: .14em; color: var(--cinza); }

  /* sobre */
  .sobre .caixa { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 6vw, 80px); align-items: center; }
  .sobre .foto { aspect-ratio: 5 / 4; border-radius: 24px; overflow: hidden; box-shadow: var(--sombra); border: 1px solid var(--linha); }
  .sobre .foto i { display: block; width: 100%; height: 100%; background-size: cover; background-position: var(--foco, 50% 50%); transform: scale(var(--zoom, 1)); transform-origin: var(--foco, 50% 50%); }
  .sobre h2 { margin: 10px 0 16px; }
  .sobre p { font-size: 1.06rem; }
  .sobre .dados { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--linha); }
  .sobre .dados b { display: block; font: 700 1.6rem var(--serif); color: var(--tinta); }
  .sobre .dados small { font: 600 .66rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--cinza); }
  @media (max-width: 860px) { .sobre .caixa { grid-template-columns: 1fr; } }

  /* galeria */
  .galeria { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 210px; gap: 14px; }
  .galeria figure { position: relative; border-radius: 18px; overflow: hidden; background: var(--linha); cursor: zoom-in; }
  .galeria figure { grid-column: var(--c, auto); grid-row: var(--r, auto); }
  .galeria img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
  .galeria figure:hover img { transform: scale(1.05); }
  .galeria figcaption { position: absolute; left: 10px; bottom: 10px; right: 10px; width: fit-content; max-width: calc(100% - 20px); background: var(--legenda); color: var(--tinta); font-size: .8rem; font-weight: 500; padding: 6px 10px; border-radius: 8px; }
  @media (max-width: 760px) { .galeria { grid-template-columns: 1fr 1fr; grid-auto-rows: 150px; } .galeria figure { grid-column: var(--cm, auto); grid-row: var(--rm, auto); } }
  .zoom { position: fixed; inset: 0; z-index: 60; background: #0c0a09e6; display: grid; place-items: center; padding: 20px; cursor: zoom-out; }
  .zoom img { max-height: 86vh; border-radius: 12px; }
  .zoom p { color: #fff; margin-top: 12px; text-align: center; font-size: .9rem; }

  /* frase */
  .frase { background: var(--ac-suave); }
  .frase p { font: 600 italic clamp(1.7rem, 3.6vw, 2.6rem)/1.25 var(--serif); color: var(--tinta); text-align: center; max-width: 24ch; margin: 0 auto; text-wrap: balance; }
  .frase p::before, .frase p::after { color: var(--ac-tinta); }
  .frase p::before { content: "“"; } .frase p::after { content: "”"; }

  /* como pedir (passos que andam com a rolagem) */
  .pedir .caixa { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 6vw, 80px); }
  .pedir .lado h2 { margin: 10px 0 36px; }
  .linha-passos { position: relative; display: grid; gap: 34px; }
  .linha-passos::before { content: ""; position: absolute; left: 21px; top: 22px; bottom: 22px; width: 2px; background: var(--linha); }
  .linha-passos .enche { position: absolute; left: 21px; top: 22px; width: 2px; height: 0; background: var(--ac); transition: height .5s ease; }
  .passo { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 18px; opacity: .38; transition: opacity .4s; }
  .passo.on, .passo.feito { opacity: 1; }
  .passo .selo { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--branco); border: 2px solid var(--linha); color: var(--cinza); font: 600 .8rem var(--mono); z-index: 1; transition: all .35s; }
  .passo.on .selo, .passo.feito .selo { background: var(--ac-forte); border-color: var(--ac-forte); color: var(--sobre-ac); }
  .passo .n { font: 600 .68rem var(--mono); letter-spacing: .14em; color: var(--ac-tinta); }
  .passo h3 { font: 600 1.35rem var(--serif); color: var(--tinta); margin: 2px 0 4px; }
  .passo p { color: var(--cinza); }
  .pedir .tela { position: sticky; top: 110px; align-self: start; }
  .chat { border-radius: 24px; overflow: hidden; border: 1px solid var(--linha); box-shadow: var(--sombra); background: var(--chat); }
  .chat .cab { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--branco); border-bottom: 1px solid var(--linha); }
  .chat .av { width: 40px; height: 40px; border-radius: 50%; background: var(--ac-forte); color: var(--sobre-ac); display: grid; place-items: center; font: 700 1.05rem var(--serif); overflow: hidden; flex: none; }
  .chat .av img { width: 100%; height: 100%; object-fit: cover; }
  .chat .cab b { display: block; color: var(--tinta); font-size: .95rem; }
  .chat .cab small { color: #16a34a; font-size: .78rem; }
  .chat .msgs { padding: 22px 16px; min-height: 300px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 9px 12px 18px; border-radius: 12px; font-size: .92rem; color: var(--msg-txt); position: relative; box-shadow: 0 1px 1px #0000001a; opacity: 0; transform: translateY(8px) scale(.98); transition: opacity .35s, transform .35s; }
  .msg.vista { opacity: 1; transform: none; }
  .msg small { position: absolute; right: 9px; bottom: 3px; font-size: .66rem; color: var(--msg-hora); }
  .msg.eu { align-self: flex-end; background: var(--msg-eu); border-top-right-radius: 4px; }
  .msg.loja { align-self: flex-start; background: var(--msg-loja); border-top-left-radius: 4px; }
  .pedir .leg { margin-top: 12px; font-size: .78rem; color: var(--cinza); text-align: center; }
  .pedir .centro { margin-top: 36px; }
  @media (max-width: 900px) { .pedir .caixa { grid-template-columns: 1fr; } .pedir .tela { position: static; } .passo { opacity: 1; } .passo .selo { background: var(--ac-forte); border-color: var(--ac-forte); color: var(--sobre-ac); } .msg { opacity: 1; transform: none; } }

  /* avaliações */
  .nota { display: flex; align-items: center; justify-content: center; gap: 16px; margin: -18px 0 40px; }
  .nota b { font: 700 3.4rem/1 var(--serif); color: var(--tinta); }
  .nota small { color: var(--cinza); font-size: .9rem; }
  .depo { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .depo figure { background: var(--branco); border: 1px solid var(--linha); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .depo blockquote { font: 500 1.08rem/1.5 var(--serif); color: var(--tinta); flex: 1; }
  .depo figcaption { display: flex; align-items: center; gap: 10px; font-size: .88rem; color: var(--cinza); }
  .depo figcaption i { width: 32px; height: 32px; border-radius: 50%; background: var(--ac-suave); color: var(--ac-tinta); display: grid; place-items: center; font: 700 .85rem var(--corpo); font-style: normal; }

  /* visite */
  .visita .caixa { display: grid; grid-template-columns: 1fr 1.15fr; gap: 24px; align-items: stretch; }
  .info { display: grid; gap: 14px; align-content: start; }
  .info > div { background: var(--branco); border: 1px solid var(--linha); border-radius: 18px; padding: 20px 22px; }
  .info h3 { font: 600 .68rem var(--mono); letter-spacing: .16em; color: var(--ac-tinta); margin-bottom: 8px; }
  .info .linha { color: var(--tinta); font-weight: 500; }
  .info table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  .info td { padding: 5px 0; border-bottom: 1px dashed var(--linha); } .info tr:last-child td { border: 0; }
  .info td + td { text-align: right; color: var(--tinta); font-weight: 500; }
  .info tr.hoje td { color: var(--ac-tinta); font-weight: 700; }
  .tels a { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; color: var(--tinta); font-weight: 600; padding: 6px 0; }

function rgb(c){var m=String(c).match(/[\d.]+/g);if(!m||m.length<3||(m.length>3&&+m[3]<.5))return null;return m.slice(0,3).map(Number)}
function lum(c){return (.299*c[0]+.587*c[1]+.114*c[2])/255}
// COR DO SITE: a cor viva que mais aparece (botões, destaques, bordas), sem o verde do WhatsApp; fundo claro ou escuro
function lerTema(){
  if(tema)return tema;var conta={},melhor=null,mx=0;
  function soma(c,p){c=rgb(c);if(!c)return;var a=Math.max.apply(0,c),b=Math.min.apply(0,c);if(a<70||(a-b)/a<.35)return;
    if(Math.abs(c[0]-37)<20&&Math.abs(c[1]-211)<25&&Math.abs(c[2]-102)<25)return;
    var k=c.map(function(v){return v>>4}).join(",");conta[k]=conta[k]||{n:0,c:c};conta[k].n+=p;if(conta[k].n>mx){mx=conta[k].n;melhor=conta[k].c}}
  document.querySelectorAll("a,button,span,em,strong,small,i,b,h1,h2,h3,div,section,li").forEach(function(e,i){if(i>1500||ui(e))return;var s=getComputedStyle(e);
    soma(s.backgroundColor,e.matches("a,button")?3:1);soma(s.color,e.matches("span,em,b,strong,small,i")?2:1);if(parseFloat(s.borderTopWidth)>=2)soma(s.borderTopColor,2)});
  var fb=rgb(getComputedStyle(document.body).backgroundColor)||rgb(getComputedStyle(document.documentElement).backgroundColor)||[255,255,255];
  var a=melhor||[47,209,180],h=document.querySelector("h2,h1");
  tema={a:"rgb("+a+")",at:lum(a)>.6?"#161616":"#fff",claro:lum(fb)>.55,f:h?getComputedStyle(h).fontFamily:""};
  document.documentElement.style.setProperty("--scd-a",tema.a);return tema;
}
function pinta(e){var t=lerTema(),s=e.style;s.setProperty("--a",t.a);s.setProperty("--at",t.at);if(t.f)s.setProperty("--f",t.f);
  if(t.claro){s.setProperty("--g","rgba(255,255,255,.82)");s.setProperty("--gt","#17191b");s.setProperty("--gs","rgba(23,25,27,.68)");s.setProperty("--gl","rgba(0,0,0,.08)")}
  return e}
function vidro(t,c,h){var e=pinta(el(t,"scd-v scd-vidro "+c,h));document.body.appendChild(e);return e}
// marca o que dá pra trocar: textos (títulos, parágrafos, itens) e fotos (img ou fundo com foto)
function marcar(){
  document.querySelectorAll("h1,h2,h3,h4,p,li,blockquote,figcaption").forEach(function(e){
    if(ui(e)||e.hasAttribute("data-scd-t")||e.closest("a,button,nav,form,footer")||!e.textContent.trim()||e.querySelector("h1,h2,h3,p,li,img,a,button"))return;
    e.setAttribute("data-scd-t","")});
  document.querySelectorAll("img,section,header,div,figure").forEach(function(e){
    if(ui(e)||e.hasAttribute("data-scd-f")||e.closest("a,button,nav"))return;
    if(e.tagName==="IMG"?(e.naturalWidth>60||e.width>60):(temFundo(e)&&e.offsetWidth>120))e.setAttribute("data-scd-f","")});
  if(ed)document.querySelectorAll("[data-scd-t]").forEach(function(e){e.contentEditable="true";e.spellcheck=false});
}
function toast(t){var x=vidro("div","scd-toast",t);requestAnimationFrame(function(){x.classList.add("on")});
  setTimeout(function(){x.classList.remove("on");setTimeout(function(){x.remove()},400)},2600)}
// MODO TESTE = igual ao editor do dono: escreve por cima, toca na foto, troca a fonte
var edBar=null;
function ligarEd(){
  if(ed)return;ed=true;document.documentElement.classList.add("scd-ed");marcar();
  edBar=vidro("div","scd-ed-bar","<span><b>✏️ Modo teste.</b> Toque num texto e escreva por cima. Toque numa foto pra trocar.</span><button class='scd-no' data-a='fonte'>Aa Fonte</button><button class='scd-ok' data-a='pronto'>Pronto</button>");
  requestAnimationFrame(function(){edBar.classList.add("on")});
  edBar.onclick=function(v){var a=v.target.closest("[data-a]");if(!a)return;if(a.dataset.a==="fonte")escolherFonte();else desligarEd()};
}
function desligarEd(){ed=false;document.documentElement.classList.remove("scd-ed");document.querySelectorAll("[data-scd-t]").forEach(function(e){e.removeAttribute("contenteditable")});
  if(edBar){edBar.classList.remove("on");var b=edBar;edBar=null;setTimeout(function(){b.remove()},400)}
  toast("Gostou? Você faz isso sozinho, quantas vezes quiser ✨")}
var mexeu=false;
document.addEventListener("input",function(v){if(v.target.closest&&v.target.closest("[data-scd-t]"))mexeu=true},true);
document.addEventListener("focusout",function(v){if(mexeu&&v.target.closest&&v.target.closest("[data-scd-t]")){mexeu=false;if(!fechado.dica1){guarda("dica1");toast("Pronto! Troque quantas vezes quiser 😉")}}},true);
function editarFoto(e){
  var i=el("input");i.type="file";i.accept="image/*";i.style.display="none";document.body.appendChild(i);
  i.onchange=function(){var f=i.files&&i.files[0];i.remove();if(!f)return;var u=URL.createObjectURL(f);
    if(e.tagName==="IMG"){e.removeAttribute("srcset");e.src=u}else e.style.backgroundImage=(getComputedStyle(e).backgroundImage.match(/linear-gradient\([^)]*\)\s*,\s*/)||[""])[0]+'url("'+u+'")';
    toast("Foto trocada! 📸 É só um teste, nada foi salvo")};
  i.click();
}
var fonteAtual="";
function escolherFonte(){
  if(!document.getElementById("scd-gf")){var l=el("link");l.id="scd-gf";l.rel="stylesheet";
    l.href="https://fonts.googleapis.com/css2?"+FONTES.map(function(f){return "family="+f[0].replace(/ /g,"+")+(/Bebas|Pacifico|Archivo|DM Serif/.test(f[0])?"":":wght@700")}).join("&")+"&display=swap";document.head.appendChild(l)}
  var fo=el("div","scd-v scd-fo"),cx=pinta(el("div","scd-vidro scd-cx","<span class='scd-tt'>Aa Fonte dos títulos</span><small>Toque numa e veja no site na hora.</small>")),g=el("div","scd-fontes"),bt=el("div","scd-bt"),ok=el("button","scd-ok","Pronto");
  FONTES.forEach(function(f){var b=el("button",f[0]===fonteAtual?"sel":"",f[0]+"<small>"+f[1]+"</small>");b.style.setProperty("--ff","'"+f[0]+"',sans-serif");
    b.onclick=function(){fonteAtual=f[0];var s=document.getElementById("scd-fonte")||document.head.appendChild(el("style"));s.id="scd-fonte";
      s.textContent="h1,h2,h3,h1 *,h2 *,h3 *{font-family:'"+f[0]+"',sans-serif!important}";g.querySelectorAll(".sel").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel")};g.appendChild(b)});
  bt.appendChild(ok);cx.append(g,bt);fo.appendChild(cx);document.body.appendChild(fo);requestAnimationFrame(function(){fo.classList.add("on")});
  function sai(){fo.classList.remove("on");setTimeout(function(){fo.remove()},250)}ok.onclick=sai;fo.onclick=function(v){if(v.target===fo)sai()};
}
document.addEventListener("click",function(v){
  if(ui(v.target)||v.target.closest("a,button"))return;
  var t=v.target.closest&&v.target.closest("[data-scd-t]"),f=v.target.closest&&v.target.closest("[data-scd-f]");
  if(!ed&&t&&fechado.bal){ligarEd();t.focus();return}
  if(t)return;   // escrevendo por cima (ou ainda sem o balão: o site funciona normal)
  if(f&&ed){v.preventDefault();v.stopPropagation();editarFoto(f)}
},true);
// escolhe um texto já na tela (de preferência com foto perto) pro balão apontar
function acharAlvo(){
  marcar();var h=innerHeight,fs=[].slice.call(document.querySelectorAll("[data-scd-f]")),ts=[].slice.call(document.querySelectorAll("[data-scd-t]"));
  for(var k=0;k<ts.length;k++){var t=ts[k],r=t.getBoundingClientRect();if(r.top<h*.1||r.bottom>h*.6||!visivel(t))continue;
    for(var j=0;j<fs.length;j++){var q=fs[j].getBoundingClientRect();if(q.bottom>0&&q.top<h&&Math.abs(q.top-r.top)<h*.6)return t}}
  for(k=0;k<ts.length;k++){r=ts[k].getBoundingClientRect();if(r.top>h*.1&&r.bottom<h*.6&&visivel(ts[k]))return ts[k]}
  return null;
}
var bal=null;
function balao(){
  if(bal||fechado.bal||ed)return;var a=acharAlvo();if(!a)return;
  bal=vidro("div","scd-bal","<span class='scd-seta'></span><button class='scd-x' aria-label='Fechar'>×</button><span class='scd-tt'>Deixe do seu jeito</span><p>"+(C.ramo?"Modelo pensado pra "+C.ramo.replace(/[<>&]/g,"")+". ":"")+
    "Toque num texto ou numa foto e troque pelo celular, quantas vezes quiser.</p><button class='scd-ok'>✏️ Testar agora</button>");
  a.classList.add("scd-alvo");
  var r=a.getBoundingClientRect(),abaixo=r.bottom+bal.offsetHeight+24<innerHeight;
  bal.classList.add(abaixo?"cima":"baixo");bal.style.top=(scrollY+(abaixo?r.bottom+16:Math.max(12,r.top-bal.offsetHeight-16)))+"px";
  var b=bal.getBoundingClientRect();bal.style.setProperty("--sx",Math.min(b.width-24,Math.max(24,r.left+Math.min(r.width,200)/2-b.left))+"px");
  requestAnimationFrame(function(){bal.classList.add("on")});
  function fecha(){guarda("bal");a.classList.remove("scd-alvo");bal.classList.remove("on");removeEventListener("scroll",some);setTimeout(function(){bal&&bal.remove()},500)}
  var y0=scrollY;function some(){if(Math.abs(scrollY-y0)>innerHeight*.7)fecha()}
  bal.querySelector(".scd-x").onclick=fecha;bal.querySelector(".scd-ok").onclick=function(){fecha();ligarEd();a.focus();try{var g=getSelection(),rg=document.createRange();rg.selectNodeContents(a);rg.collapse(false);g.removeAllRanges();g.addRange(rg)}catch(e){}};
  setTimeout(function(){addEventListener("scroll",some,{passive:true})},800);
}
var bar=null;
function barra(){
  if(bar||fechado.bar)return;
  bar=vidro("div","scd-bar",C.barra+"<button class='scd-x' aria-label='Fechar'>×</button>");
  requestAnimationFrame(function(){bar.classList.add("on")});
  bar.querySelector(".scd-x").onclick=function(){guarda("bar");bar.classList.remove("on");var b=bar;bar=null;setTimeout(function(){b.remove()},500)};
}
// ritmo (Caio: "se for direto na cara ele nem vê"): balão quando chega perto do MEIO e para de rolar por um instante;
// a barra do preço só perto do FIM
var parou=0;
function rolou(){var y=scrollY,tot=Math.max(1,document.documentElement.scrollHeight-innerHeight),p=y/tot;clearTimeout(parou);
  if(p>.3&&y>innerHeight*.8)parou=setTimeout(balao,1200);if(p>.75)barra()}
addEventListener("scroll",rolou,{passive:true});
addEventListener("load",function(){setTimeout(marcar,800)});
})();
