<html lang="pt-BR">

<title>Barbearia do Teste · Barbearia em Praia Grande</title>
<!-- 17/10 (Caio: "fazer um modelo desse tipo de site super premium pra galera"): MODELO SUPER PREMIUM. Mesmos dados dos
     outros modelos (o JSON do bloco "dados"), sem IA: capa cheia com a foto, títulos grandes, movimento ao rolar, nota contando,
     depoimentos, passos, galeria com zoom, "aberto agora" pelo horário, mapa e botão de WhatsApp fixo.
     Contrato com previas.js: <title>, footer .prop / .cd, links wa.me / tel: / maps (contador). Editor: data-campo / data-foto. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--escura:#14110f;--media:#3a2b20;--destaque:#d9a441;--clara:#f6efe4;--fundo:#f6efe4;--tinta:#14110f;--tinta2:#5b4f45;--linha:rgba(20,17,15,.12);--cartao:#fffaf2;--sobre-destaque:#1a1208;--ease:cubic-bezier(.16,1,.3,1)}
.escuro{--fundo:#0f0d0c;--tinta:#f3ece2;--tinta2:#b5a999;--linha:rgba(255,255,255,.1);--cartao:#181513}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--tinta);font:400 17px/1.6 Figtree,system-ui,sans-serif;overflow-x:hidden}
::selection{background:var(--destaque);color:var(--sobre-destaque)}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--destaque);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:0;text-wrap:balance}
h1 em,h2 em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--destaque)}
p{margin:0}
.box{max-width:1180px;margin:0 auto;padding:0 20px}
svg.i{width:20px;height:20px;flex:none}
[hidden]{display:none!important}

.bt{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;font:700 16px Figtree,sans-serif;text-decoration:none;padding:16px 26px;border:0;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.bt-forte{background:var(--destaque);color:var(--sobre-destaque);box-shadow:0 12px 30px -12px color-mix(in srgb,var(--destaque) 80%,transparent)}
.bt-forte:hover{transform:translateY(-3px)}
.bt-vidro{background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.bt-vidro:hover{background:rgba(255,255,255,.2)}
.bt-linha{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 1.5px var(--linha)}
.bt-linha:hover{box-shadow:inset 0 0 0 1.5px var(--tinta)}

/* topo */
.topo{position:fixed;inset:0 0 auto;z-index:30;transition:background .35s,box-shadow .35s,color .35s;color:#fff}
.topo.rolou{background:color-mix(in srgb,var(--fundo) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);box-shadow:0 1px 0 var(--linha);color:var(--tinta)}
.topo .box{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.marca{display:flex;align-items:center;gap:12px;text-decoration:none;font:800 20px "Bricolage Grotesque";letter-spacing:-.02em;min-width:0}
.marca .av{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--destaque);color:var(--sobre-destaque);font:800 18px "Bricolage Grotesque";overflow:hidden;background-repeat:no-repeat}
.marca .av img{width:100%;height:100%;object-fit:contain;background:#fff}
.marca .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo nav{display:flex;align-items:center;gap:24px;font-weight:600;font-size:15px}
.topo nav a.lk{text-decoration:none;opacity:.8}
.topo nav a.lk:hover{opacity:1}
.topo .bt{padding:11px 18px;font-size:15px}

/* capa */
.capa{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#fff;overflow:hidden;isolation:isolate}
.capa .fundo-foto{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:var(--foco,50% 50%);transform:scale(calc(var(--zoom,1) * 1.08));animation:respira 18s ease-in-out infinite alternate}
@keyframes respira{to{transform:scale(calc(var(--zoom,1) * 1.16)) translateY(-1.5%)}}
.capa::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.15) 35%,rgba(0,0,0,.78) 100%),linear-gradient(90deg,color-mix(in srgb,var(--escura) 70%,transparent),transparent 70%)}
.capa .box{width:100%;padding-bottom:72px;padding-top:140px}
.capa .local{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);padding:8px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.capa .local .ponto{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 4px rgba(61,220,132,.25)}
.capa .local .ponto.fechado{background:#ff6b5e;box-shadow:0 0 0 4px rgba(255,107,94,.25)}
.capa h1{font-size:clamp(46px,7.6vw,104px);max-width:14ch;margin:22px 0 22px}
.capa .sub{font-size:clamp(18px,1.8vw,21px);max-width:46ch;color:rgba(255,255,255,.86)}
.capa .acoes{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.capa .nota-capa{position:absolute;right:20px;bottom:72px;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);border-radius:22px;padding:16px 20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);text-align:center}
.capa .nota-capa b{display:block;font:800 40px/1 "Bricolage Grotesque"}
.capa .nota-capa small{opacity:.85;font-size:13px}
.estrelas{color:#ffc84a;letter-spacing:2px}
.entra{opacity:0;transform:translateY(26px);animation:entra 1.1s var(--ease) forwards}
@keyframes entra{to{opacity:1;transform:none}}

/* faixa dos destaques */
.faixa{background:var(--destaque);color:var(--sobre-destaque);overflow:hidden;padding:18px 0}
.faixa .trilho{display:flex;gap:46px;width:max-content;animation:corre 30s linear infinite}
.faixa:hover .trilho{animation-play-state:paused}
@keyframes corre{to{transform:translateX(-50%)}}
.faixa span{display:inline-flex;align-items:center;gap:14px;font:700 21px "Bricolage Grotesque";letter-spacing:-.02em;white-space:nowrap}
.faixa span::before{content:"✦";font-size:14px}

section{padding:110px 0}
.chapeu{font-weight:700;font-size:15px;color:var(--destaque);margin-bottom:14px}
.titulo{max-width:760px;margin-bottom:54px}
.titulo h2{font-size:clamp(34px,5vw,64px)}
.titulo p{font-size:19px;color:var(--tinta2);margin-top:18px;max-width:56ch}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.rv.visto{opacity:1;transform:none}

/* produtos: lista grande com seta */
.lista{border-top:1px solid var(--linha)}
.item{display:grid;grid-template-columns:70px 1fr auto;gap:22px;align-items:center;padding:28px 6px;border-bottom:1px solid var(--linha);text-decoration:none;position:relative;transition:padding .45s var(--ease)}
.item::before{content:"";position:absolute;inset:0;background:var(--cartao);transform:scaleY(0);transform-origin:bottom;transition:transform .45s var(--ease);z-index:-1;border-radius:14px}
.item:hover{padding-left:18px}
.item:hover::before{transform:scaleY(1)}
.item .ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--destaque) 16%,transparent)}
.item h3{font-size:clamp(22px,2.6vw,32px)}
.item p{color:var(--tinta2);margin-top:4px;max-width:60ch}
.item .seta{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--linha);transition:background .3s,transform .45s var(--ease)}
.item:hover .seta{background:var(--destaque);color:var(--sobre-destaque);transform:rotate(-45deg);box-shadow:none}

/* sobre */
.sobre .box{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.sobre .foto{aspect-ratio:4/5;border-radius:32px;overflow:hidden;position:relative;box-shadow:0 50px 90px -50px rgba(0,0,0,.6)}
.sobre .foto i{position:absolute;inset:0;background-size:cover;background-position:var(--foco,50% 50%);transform:scale(var(--zoom,1));transition:transform 1.4s var(--ease)}
.sobre .foto:hover i{transform:scale(calc(var(--zoom,1) * 1.05))}
.sobre h2{font-size:clamp(34px,4.6vw,58px)}
.sobre .txt{font-size:19px;color:var(--tinta2);margin-top:22px}
.frase{margin-top:34px;font:400 italic clamp(26px,3vw,36px)/1.15 "Instrument Serif",Georgia,serif;color:var(--tinta);padding-left:22px;box-shadow:inset 3px 0 0 var(--destaque)}

/* avaliações */
.aval{background:var(--escura);color:#f3ece2}
.aval .titulo p{color:#b5a999}
.aval .topo-aval{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:46px}
.aval .grande{display:flex;align-items:center;gap:22px}
.aval .grande b{font:800 clamp(72px,10vw,130px)/.9 "Bricolage Grotesque";letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.aval .grande small{display:block;color:#b5a999;font-size:15px;margin-top:6px}
.depos{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.depo{background:rgba(255,255,255,.05);border-radius:26px;padding:28px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);display:flex;flex-direction:column;gap:18px;margin:0}
.depo blockquote{margin:0;font:400 italic 22px/1.35 "Instrument Serif",Georgia,serif;color:#f3ece2}
.depo figcaption{display:flex;align-items:center;gap:12px;color:#b5a999;font-weight:600;margin-top:auto}
.depo figcaption i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--destaque);color:var(--sobre-destaque);font:800 16px "Bricolage Grotesque";font-style:normal}

/* passos */
.passos{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;position:relative;counter-reset:p}
.passos::before{content:"";position:absolute;top:30px;left:30px;right:30px;height:2px;background:var(--linha)}
.passos .linha{position:absolute;top:30px;left:30px;height:2px;width:0;background:var(--destaque);transition:width 2s var(--ease)}
.passos.visto .linha{width:calc(100% - 60px)}
.passo .n{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--fundo);box-shadow:inset 0 0 0 2px var(--linha);font:800 22px "Bricolage Grotesque";position:relative;z-index:1;transition:background .5s,color .5s,box-shadow .5s}
.passos.visto .passo .n{background:var(--destaque);color:var(--sobre-destaque);box-shadow:0 0 0 8px color-mix(in srgb,var(--destaque) 18%,transparent)}
.passos.visto .passo:nth-child(3) .n{transition-delay:.6s}.passos.visto .passo:nth-child(4) .n{transition-delay:1.2s}
.passo h3{font-size:25px;margin:22px 0 8px}
.passo p{color:var(--tinta2)}

/* galeria */
.galeria{columns:3 280px;column-gap:16px}
.galeria figure{margin:0 0 16px;break-inside:avoid;border-radius:22px;overflow:hidden;position:relative;cursor:zoom-in}
.galeria img{width:100%;transition:transform 1s var(--ease)}
.galeria figure:hover img{transform:scale(1.05)}
.galeria figcaption{position:absolute;left:12px;bottom:12px;right:12px;color:#fff;font-weight:600;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.6);opacity:0;transform:translateY(8px);transition:all .4s var(--ease)}
.galeria figure:hover figcaption{opacity:1;transform:none}
.zoom{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .35s}
.zoom.on{opacity:1;pointer-events:auto}
.zoom img{max-height:86vh;border-radius:16px;transform:scale(.94);transition:transform .45s var(--ease)}
.zoom.on img{transform:none}
.zoom button{position:absolute;top:18px;right:18px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:26px;cursor:pointer}

/* visite */
.visite .box{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:stretch}
.info{display:grid;gap:26px;align-content:start}
.info h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2);font-family:Figtree;font-weight:700;margin-bottom:8px}
.info .grande{font:700 22px/1.35 "Bricolage Grotesque";letter-spacing:-.01em}
.info table{border-collapse:collapse;width:100%;max-width:420px}
.info td{padding:8px 0;border-bottom:1px solid var(--linha)}
.info td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.info tr.hoje td{font-weight:700;color:var(--destaque)}
.info .tels{display:flex;flex-wrap:wrap;gap:10px}
.info .tels a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;padding:10px 14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--linha)}
.info .tels a:hover{box-shadow:inset 0 0 0 1.5px var(--tinta)}
.info .redes{display:flex;gap:10px}
.info .redes a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--linha)}
.mapa{border-radius:28px;overflow:hidden;min-height:380px;box-shadow:0 0 0 1px var(--linha);background:var(--cartao)}
.mapa iframe{width:100%;height:100%;min-height:380px;border:0;filter:saturate(.9)}

/* chamada final */
.chamada{position:relative;overflow:hidden;background:var(--escura);color:#fff;text-align:center;padding:120px 0}
.chamada::before{content:"";position:absolute;width:700px;height:700px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,color-mix(in srgb,var(--destaque) 40%,transparent),transparent 65%);animation:pulsa 8s ease-in-out infinite}
@keyframes pulsa{50%{transform:translate(-50%,-50%) scale(1.15)}}
.chamada .box{position:relative}
.chamada h2{font-size:clamp(38px,6vw,78px);max-width:14ch;margin:0 auto}
.chamada p{margin:20px auto 34px;color:rgba(255,255,255,.75);font-size:19px;max-width:44ch}

footer{background:#0a0908;color:#9a8f83;padding:36px 0;font-size:14px}
footer .box{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center}
footer a{color:#e8dfd4}
.zapfixo{position:fixed;right:18px;bottom:18px;z-index:40;width:62px;height:62px;border-radius:50%;background:#1fa855;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);transform:scale(0);transition:transform .5s var(--ease)}
.zapfixo.on{transform:none}
.zapfixo svg{width:31px;height:31px;color:#fff}
.zapfixo::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #1fa855;animation:onda 2.6s var(--ease) infinite}
@keyframes onda{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.3)}}

@media (max-width:900px){
  .topo nav a.lk{display:none}
  .capa .nota-capa{position:static;display:inline-block;margin-top:26px}
  .sobre .box,.visite .box{grid-template-columns:1fr;gap:40px}
  .depos{grid-template-columns:1fr}
  .passos{grid-template-columns:1fr;gap:30px}
  .passos::before{top:30px;bottom:30px;left:29px;right:auto;width:2px;height:auto}
  .passos .linha{left:29px;width:2px;height:0;transition:height 2s var(--ease)}
  .passos.visto .linha{width:2px;height:calc(100% - 60px)}
  .passo{display:grid;grid-template-columns:60px 1fr;gap:18px}
  .passo h3{margin:12px 0 6px}
  .item{grid-template-columns:56px 1fr;gap:16px}
  .item .ic{width:52px;height:52px;font-size:25px}
  .item .seta{display:none}
  section{padding:80px 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .entra,.rv{opacity:1;transform:none}
}
</style>

<script>
(function () {

  const tem = (x) => Array.isArray(x) ? x.length > 0 : !!(x && String(x).trim());
  const marcado = (t) => esc(t).replace(/\*([^*]+)\*/g, "<em>$1</em>");

  // cores e tema (claro/escuro), iguais aos outros modelos
  const C = D.cores || {}, raiz = document.documentElement.style;
  if (C.escura) raiz.setProperty("--escura", C.escura);

  if (C.clara) { raiz.setProperty("--clara", C.clara); raiz.setProperty("--fundo", C.clara); }
  const lum = (h) => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); if (!m) return .5; const n = parseInt(m[1], 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };

  const zapNum = zap ? (zap.length <= 11 ? "55" + zap : zap) : "";

  } else av.textContent = nome.trim()[0] || "•";

  // menu
  const menu = [["produtos", D.produtos_titulo_menu || "O que temos", tem(D.produtos)], ["sobre", "Quem somos", tem(D.sobre)], ["avaliacoes", "Avaliações", tem(D.avaliacoes?.lista)], ["visite", "Onde estamos", true]];

  // capa
  const capa = $("#capaFoto");
  if (D.foto_capa) { capa.style.backgroundImage = `url("${D.foto_capa}")`; capa.style.setProperty("--foco", D.foto_capa_foco || "50% 50%"); if (D.foto_capa_zoom) capa.style.setProperty("--zoom", D.foto_capa_zoom); }

  $("#localTxt").textContent = [D.ramo, D.cidade].filter(Boolean).join(" · ");

  $("#subtitulo").textContent = D.subtitulo || "";
  $("#acoes").innerHTML = (zapUrl ? `<a class="bt bt-forte" href="${zapUrl}" target="_blank" rel="noopener">${ZAP}Chamar no WhatsApp</a>` : (telPrinc ? `<a class="bt bt-forte" href="tel:${telPrinc.replace(/\D/g, "")}"><svg class="i"><use href="#tel"/></svg>Ligar agora</a>` : ""))

  // aberto agora (pelo horário "Seg a Sex" / "08:00 – 18:00")
  const DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"], hoje = new Date(), dHoje = hoje.getDay(), mins = hoje.getHours() * 60 + hoje.getMinutes();
  const idx = (t) => DIAS.findIndex((d) => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").startsWith(d.normalize("NFD").replace(/[̀-ͯ]/g, "")));
  function ehHoje(dias) {

  function abertoAgora() {

      for (const [, a1, a2, b1, b2] of String(h.horas).matchAll(/(\d{1,2})[:h](\d{2})?\s*(?:às|a|-|–)\s*(\d{1,2})[:h](\d{2})?/g)) {
        const ini = +a1 * 60 + +(a2 || 0), fim = +b1 * 60 + +(b2 || 0);

  // faixa dos destaques

    if (foto) { f.innerHTML = '<i data-foto="foto_sobre"></i>'; f.firstChild.style.backgroundImage = `url("${foto}")`; f.style.setProperty("--foco", D.foto_sobre_foco || "50% 50%"); if (D.foto_sobre_zoom) f.style.setProperty("--zoom", D.foto_sobre_zoom); }

  // avaliações

    + (endereco ? `<div><h3>Endereço</h3><p class="grande">${esc(endereco)}</p>${mapsUrl ? `<p style="margin-top:10px"><a href="${mapsUrl}" target="_blank" rel="noopener" style="font-weight:700;color:var(--destaque)">Abrir no mapa →</a></p>` : ""}</div>` : "")
    + (tem(D.horario) ? `<div><h3>Horário</h3><table>${D.horario.map((h) => `<tr${ehHoje(h.dias) ? ' class="hoje"' : ""}><td>${esc(h.dias)}</td><td>${esc(h.horas)}</td></tr>`).join("")}</table></div>` : "")
    + (tels.length ? `<div><h3>Contato</h3><div class="tels">${tels.map((t) => t.whatsapp ? `<a href="https://wa.me/${(() => { const n = t.numero.replace(/\D/g, ""); return n.length <= 11 ? "55" + n : n; })()}" target="_blank" rel="noopener">${ZAP}${esc(t.numero)}</a>` : `<a href="tel:${t.numero.replace(/\D/g, "")}"><svg class="i"><use href="#tel"/></svg>${esc(t.numero)}</a>`).join("")}</div></div>` : "")
    + ((D.instagram || D.facebook) ? `<div class="redes">${D.instagram ? `<a href="${esc(/^https?:/.test(D.instagram) ? D.instagram : "https://instagram.com/" + D.instagram.replace(/^@/, ""))}" target="_blank" rel="noopener" aria-label="Instagram"><svg class="i"><use href="#insta"/></svg></a>` : ""}${D.facebook ? `<a href="${esc(D.facebook)}" target="_blank" rel="noopener" aria-label="Facebook"><svg class="i"><use href="#face"/></svg></a>` : ""}</div>` : "");
  if (endereco) $("#mapa").innerHTML = `<iframe loading="lazy" title="Mapa: ${esc(nome)}" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${encodeURIComponent(nome + " " + endereco)}&output=embed"></iframe>`;
  else $("#mapa").hidden = true;

  // chamada final
  $("#chamTitulo").innerHTML = marcado(D.frase ? D.frase.replace(/\.$/, "") + "." : "A gente te espera.");
  $("#chamTexto").textContent = zapUrl ? "Chama no WhatsApp e a gente responde rapidinho." : "Passa aqui ou liga pra gente.";
  $("#chamBt").innerHTML = zapUrl ? `<a class="bt bt-forte" href="${zapUrl}" target="_blank" rel="noopener">${ZAP}Chamar no WhatsApp</a>` : (telPrinc ? `<a class="bt bt-forte" href="tel:${telPrinc.replace(/\D/g, "")}"><svg class="i"><use href="#tel"/></svg>Ligar agora</a>` : "");
  const zf = $("#zapfixo"); if (zapUrl) { zf.hidden = false; zf.href = zapUrl; }

  // movimento: aparece ao rolar, nota contando, linha dos passos
  const contar = (el) => { const fim = +el.dataset.n, t0 = performance.now(); const p = (t) => { const k = Math.min(1, (t - t0) / 1400); el.textContent = (fim * (1 - Math.pow(1 - k, 3))).toFixed(1).replace(".", ","); if (k < 1) requestAnimationFrame(p); }; requestAnimationFrame(p); };
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (!e.isIntersecting) return; e.target.classList.add("visto"); io.unobserve(e.target); e.target.querySelectorAll?.("[data-n]").forEach(contar); }), { threshold: .2 });
  document.querySelectorAll(".rv, #passos").forEach((el) => io.observe(el));

  // zoom na galeria
  const zoom = $("#zoom");
  $("#galeria").addEventListener("click", (e) => { const im = e.target.closest("img"); if (!im || document.body.classList.contains("editando")) return; zoom.querySelector("img").src = im.src; zoom.classList.add("on"); });
  zoom.addEventListener("click", () => zoom.classList.remove("on"));
  addEventListener("keydown", (e) => { if (e.key === "Escape") zoom.classList.remove("on"); });

  // topo e WhatsApp fixo
  const topo = $("#topo");
  const rolar = () => { topo.classList.toggle("rolou", scrollY > 40); zf.classList.toggle("on", scrollY > 500); };
  addEventListener("scroll", rolar, { passive: true }); rolar();
})();
</script>
